<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rumble System</title>
<style>
* { box-sizing: border-box; }
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #050914;
  color: white;
  text-align: center;
}
header {
  padding: 25px;
  background: #0b1428;
  border-bottom: 1px solid #1677ff;
}
h1 { color: #168bff; font-size: 38px; }
main { padding: 70px 20px; }
h2 { font-size: 30px; }
p { color: #aab8ce; font-size: 17px; }
button {
  background: #087cff;
  color: white;
  border: 0;
  padding: 15px 30px;
  border-radius: 10px;
  font-size: 17px;
  margin-top: 20px;
}
.card {
  max-width: 500px;
  margin: 35px auto;
  padding: 25px;
  background: #101d35;
  border: 1px solid #173e70;
  border-radius: 15px;
}
</style>
</head>
<body>
<header>
<h1>RUMBLE SYSTEM</h1>
<p>THE ULTIMATE DISCORD EXPERIENCE</p>
</header>
<main>
<h2>مرحباً بك في Rumble System</h2>
<p>لوحة التحكم الاحترافية الخاصة بسيرفر Discord الخاص بك.</p>
<div class="card">
<h2>🚀 قريباً</h2>
<p>نعمل على تجهيز لوحة تحكم متكاملة لإدارة البوت.</p>
<button>Coming Soon</button>
</div>
</main>
</body>
</html>
