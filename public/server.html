<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Rumble System | Server Dashboard</title>

    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background: #070d18;
            color: white;
            font-family: 'Cairo', sans-serif;
        }

        header {
            background: #101a2b;
            border-bottom: 1px solid #258cff;
            padding: 20px;
            text-align: center;
            box-shadow: 0 3px 20px rgba(37,140,255,.15);
        }

        header h1 {
            margin: 0;
            color: #258cff;
            font-size: 25px;
        }

        header p {
            margin: 10px 0;
        }

        main {
            max-width: 900px;
            margin: 45px auto;
            padding: 20px;
        }

        .server-panel {
            background: linear-gradient(145deg, #101a2b, #080f1c);
            border: 1px solid #258cff;
            border-radius: 20px;
            padding: 30px 20px;
            text-align: center;
            box-shadow: 0 0 25px rgba(37,140,255,.15);
        }

        .server-icon {
            width: 110px;
            height: 110px;
            border-radius: 25px;
            border: 3px solid #258cff;
            object-fit: cover;
        }

        h2 {
            color: #64b5ff;
            overflow-wrap: anywhere;
        }

        .status {
            color: #36d98a;
            margin: 15px 0;
        }

        .coming-soon {
            margin-top: 30px;
            padding: 22px;
            background: #080f1c;
            border: 1px solid #24466d;
            border-radius: 14px;
        }

        .coming-soon h3 {
            color: #258cff;
        }

        .embed-button {
            display: block;
            max-width: 350px;
            width: 100%;
            margin: 22px auto 0;
            padding: 14px 20px;
            background: linear-gradient(135deg, #258cff, #0755b8);
            border: 1px solid #58adff;
            border-radius: 12px;
            color: white;
            text-decoration: none;
            font-family: 'Cairo', sans-serif;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: .3s ease;
        }

        .embed-button:hover {
            transform: translateY(-3px);
            box-shadow: 0 0 22px rgba(37,140,255,.5);
        }

        .back-button {
            display: inline-block;
            margin-top: 25px;
            padding: 12px 25px;
            background: linear-gradient(135deg, #258cff, #0755b8);
            border-radius: 10px;
            color: white;
            text-decoration: none;
            font-weight: bold;
        }

        .back-button:hover {
            box-shadow: 0 0 18px rgba(37,140,255,.5);
        }

        .error {
            color: #ff7777;
        }

        #serverLanguage {
            background: #101a2b;
            color: white;
            border: 1px solid #258cff;
            border-radius: 10px;
            padding: 10px;
            font-family: Cairo, sans-serif;
            margin-top: 10px;
            cursor: pointer;
        }
    </style>
</head>

<body>

<header>
    <h1>💙 Rumble System</h1>

    <p id="serverPageTitle"></p>

    <select id="serverLanguage" aria-label="Language">
        <option value="ar">🇪🇬 العربية</option>
        <option value="en">🇺🇸 English</option>
        <option value="fr">🇫🇷 Français</option>
        <option value="de">🇩🇪 Deutsch</option>
        <option value="es">🇪🇸 Español</option>
    </select>
</header>

<main>
    <div class="server-panel" id="serverPanel"></div>
</main>

<script>

const serverTranslations = {

    ar: {
        pageTitle: "لوحة التحكم الخاصة بالسيرفر",
        loading: "جارٍ التحقق من السيرفر...",
        verified: "● تم التحقق من السيرفر بنجاح",
        settings: "⚙️ إعدادات السيرفر",
        description: "اختر الأداة التي تريد استخدامها في هذا السيرفر.",
        embedStudio: "🎨 فتح منشئ الـ Embed",
        ticketStudio: "🎫 نظام التكتات وإنشاء Panels",
        back: "العودة إلى الداشبورد",
        login: "يرجى تسجيل الدخول أولاً.",
        noAccess: "ليس لديك صلاحية الوصول إلى هذا السيرفر.",
        membershipHint: "تأكد من أنك عضو في السيرفر وأن البوت موجود فيه.",
        invalid: "رابط السيرفر غير صالح.",
        error: "حدث خطأ أثناء تحميل لوحة التحكم.",
        iconAlt: "أيقونة السيرفر"
    },

    en: {
        pageTitle: "Server Dashboard",
        loading: "Verifying server...",
        verified: "● Server verified successfully",
        settings: "⚙️ Server Settings",
        description: "Choose the tool you want to use on this server.",
        embedStudio: "🎨 Open Embed Studio",
        ticketStudio: "🎫 Ticket System & Panel Builder",
        back: "Back to Dashboard",
        login: "Please log in first.",
        noAccess: "You do not have permission to access this server.",
        membershipHint: "Make sure you are a server member and the bot is present.",
        invalid: "Invalid server link.",
        error: "An error occurred while loading the dashboard.",
        iconAlt: "Server icon"
    },

    fr: {
        pageTitle: "Tableau de bord du serveur",
        loading: "Vérification du serveur...",
        verified: "● Serveur vérifié avec succès",
        settings: "⚙️ Paramètres du serveur",
        description: "Choisissez l’outil que vous souhaitez utiliser sur ce serveur.",
        embedStudio: "🎨 Ouvrir Embed Studio",
        ticketStudio: "🎫 Système de tickets et Panels",
        back: "Retour au tableau de bord",
        login: "Veuillez d’abord vous connecter.",
        noAccess: "Vous n’avez pas accès à ce serveur.",
        membershipHint: "Vérifiez que vous êtes membre du serveur et que le bot y est présent.",
        invalid: "Lien du serveur invalide.",
        error: "Une erreur est survenue lors du chargement du tableau de bord.",
        iconAlt: "Icône du serveur"
    },

    de: {
        pageTitle: "Server-Dashboard",
        loading: "Server wird überprüft...",
        verified: "● Server erfolgreich überprüft",
        settings: "⚙️ Servereinstellungen",
        description: "Wähle das Werkzeug aus, das du auf diesem Server verwenden möchtest.",
        embedStudio: "🎨 Embed Studio öffnen",
        ticketStudio: "🎫 Ticket-System und Panels",
        back: "Zurück zum Dashboard",
        login: "Bitte melde dich zuerst an.",
        noAccess: "Du hast keine Berechtigung für diesen Server.",
        membershipHint: "Stelle sicher, dass du Mitglied des Servers bist und der Bot vorhanden ist.",
        invalid: "Ungültiger Serverlink.",
        error: "Beim Laden des Dashboards ist ein Fehler aufgetreten.",
        iconAlt: "Serversymbol"
    },

    es: {
        pageTitle: "Panel del servidor",
        loading: "Verificando servidor...",
        verified: "● Servidor verificado correctamente",
        settings: "⚙️ Configuración del servidor",
        description: "Elige la herramienta que deseas utilizar en este servidor.",
        embedStudio: "🎨 Abrir Embed Studio",
        ticketStudio: "🎫 Sistema de tickets y Panels",
        back: "Volver al panel principal",
        login: "Inicia sesión primero.",
        noAccess: "No tienes permiso para acceder a este servidor.",
        membershipHint: "Asegúrate de ser miembro del servidor y de que el bot esté presente.",
        invalid: "El enlace del servidor no es válido.",
        error: "Se produjo un error al cargar el panel.",
        iconAlt: "Icono del servidor"
    }

};


// اللغة المحفوظة

let serverLanguage = localStorage.getItem("rumbleLanguage") || "ar";

if (!serverTranslations[serverLanguage]) {
    serverLanguage = "ar";
}

let serverText = serverTranslations[serverLanguage];


// حالة الصفحة

let currentGuild = null;
let currentError = null;
let isLoading = true;


// تطبيق اللغة

function applyServerLanguage(lang) {

    if (!serverTranslations[lang]) {
        lang = "ar";
    }

    serverLanguage = lang;
    serverText = serverTranslations[lang];

    localStorage.setItem("rumbleLanguage", lang);

    document.documentElement.lang = lang;

    document.documentElement.dir =
        lang === "ar" ? "rtl" : "ltr";

    document.getElementById("serverPageTitle").textContent =
        serverText.pageTitle;

    document.getElementById("serverLanguage").value = lang;

    renderServerPage();
}


// زر الرجوع

function createBackButton() {

    const back = document.createElement("a");

    back.className = "back-button";
    back.href = "/";
    back.textContent = serverText.back;

    return back;
}


// عرض رسالة الخطأ

function renderError(panel, message, hint = null) {

    const heading = document.createElement("h2");

    heading.className = "error";
    heading.textContent = message;

    const elements = [heading];

    if (hint) {

        const description = document.createElement("p");

        description.textContent = hint;

        elements.push(description);
    }

    elements.push(createBackButton());

    panel.replaceChildren(...elements);
}


// إعادة بناء محتويات الصفحة حسب اللغة

function renderServerPage() {

    const panel = document.getElementById("serverPanel");

    if (isLoading) {

        const loading = document.createElement("p");

        loading.textContent = serverText.loading;

        panel.replaceChildren(loading);

        return;
    }

    if (currentError) {

        if (currentError === "noAccess") {

            renderError(
                panel,
                serverText.noAccess,
                serverText.membershipHint
            );

        } else {

            renderError(panel, serverText[currentError]);
        }

        return;
    }

    if (!currentGuild) {
        return;
    }

    const elements = [];

    // أيقونة السيرفر

    const icon = document.createElement("img");

    icon.className = "server-icon";
    icon.alt = serverText.iconAlt;

    if (currentGuild.icon) {

        icon.src =
            `https://cdn.discordapp.com/icons/${currentGuild.id}/${currentGuild.icon}.png?size=128`;

    } else {

        icon.style.display = "none";
    }

    elements.push(icon);


    // اسم السيرفر

    const title = document.createElement("h2");

    title.textContent = currentGuild.name;

    elements.push(title);


    // حالة التحقق

    const status = document.createElement("p");

    status.className = "status";
    status.textContent = serverText.verified;

    elements.push(status);


    // قسم الإعدادات

    const section = document.createElement("div");

    section.className = "coming-soon";

    const heading = document.createElement("h3");

    heading.textContent = serverText.settings;

    const description = document.createElement("p");

    description.textContent = serverText.description;


    // زر Embed Studio

    const embedButton = document.createElement("a");

    embedButton.className = "embed-button";

    embedButton.href =
        `/embed.html?guild=${encodeURIComponent(currentGuild.id)}`;

    embedButton.textContent = serverText.embedStudio;

    const ticketButton = document.createElement("a");
    ticketButton.className = "embed-button";
    ticketButton.href = `/tickets.html?guild=${encodeURIComponent(currentGuild.id)}`;
    ticketButton.textContent = serverText.ticketStudio;

    section.append(
        heading,
        description,
        embedButton,
        ticketButton
    );

    elements.push(section);


    // زر العودة

    elements.push(createBackButton());

    panel.replaceChildren(...elements);
}


// تشغيل الصفحة

document.addEventListener("DOMContentLoaded", async () => {

    const selector = document.getElementById("serverLanguage");


    // تطبيق اللغة المحفوظة

    applyServerLanguage(serverLanguage);


    // تغيير اللغة دون إعادة تحميل الصفحة

    selector.addEventListener("change", event => {

        applyServerLanguage(event.target.value);

    });


    // استقبال تغيير اللغة من تبويب آخر

    window.addEventListener("storage", event => {

        if (event.key === "rumbleLanguage" && event.newValue) {

            applyServerLanguage(event.newValue);

        }

    });


    // التحقق من رابط السيرفر

    const params = new URLSearchParams(window.location.search);

    const guildId = params.get("guild");

    if (!guildId || !/^\d{17,20}$/.test(guildId)) {

        isLoading = false;
        currentError = "invalid";

        renderServerPage();

        return;
    }


    // جلب السيرفرات المسموح بها

    try {

        const response = await fetch("/api/guilds", {

            credentials: "same-origin",
            cache: "no-store"

        });


        if (response.status === 401) {

            isLoading = false;
            currentError = "login";

            renderServerPage();

            return;
        }


        if (!response.ok) {

            throw new Error("Guild verification failed");

        }


        const data = await response.json();

        const guild = data.guilds.find(item => item.id === guildId);


        if (!guild) {

            isLoading = false;
            currentError = "noAccess";

            renderServerPage();

            return;
        }


        // حفظ بيانات السيرفر

        currentGuild = guild;

        isLoading = false;

        renderServerPage();


    } catch (error) {

        console.error(error);

        isLoading = false;
        currentError = "error";

        renderServerPage();

    }

});

</script>

</body>
</html>
